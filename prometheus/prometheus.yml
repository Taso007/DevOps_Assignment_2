global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alerting rules.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus scrapes its own metrics.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the instrumented application.
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ['app:3000']
